services:
  - type: web
    name: sheaura
    runtime: node
    plan: free
    region: singapore # Nearest to your Neon database (ap-southeast-1)
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_URL
        sync: false
